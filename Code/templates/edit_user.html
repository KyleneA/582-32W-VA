{% extends "base.html" %} 
    {% block title %} Edit User | XYZ Apartment {% endblock %} 

    {% block banner %}
    <h1>Edit {{ user_role }}</h1>
    {% endblock %}
    
    {% block content %}
    <section class="create-user">
        <div class="container">
            <form method="POST">
                <div class="general-inputs">
                    <div class="info">

                        <div class="input-div">
                            <label for="full-name" class="required"> Full Name </label>
                            <input 
                                id="full-name"
                                name="full-name"
                                type="text"
                                value="{{ full_name or user.name }}"
                                maxlength="100"
                                required
                            >
                        </div>
            
                        <div class="input-div">
                            <label for="email" class="required">
                                Email Address
                            </label>
                
                            <input
                                id="email"
                                name="email"
                                type="email"
                                value="{{ email or user.email }}"
                                maxlength="255"
                                required
                            />
                        </div>
                    </div>

                {% if user_role == 'resident' %}
                <div class="resident-inputs">
                    <div class="info">
                        <div class="input-div">
                            <label for="apartment" class="required"> Apartment </label>
                            <input 
                                id="apartment"
                                name="apartment"
                                type="text"
                                value="{{ apartment or user.apartment }}"
                                maxlength="4"
                                required
                            >
                        </div>
            
                        <div class="input-div">
                            <label for="locker" class="required"> Locker </label>
                            <input 
                                id="locker"
                                name="locker"
                                type="text"
                                value="{{ locker or user.locker_location }}"
                                maxlength="100"
                                required
                            >
                        </div>
            
                        <div class="input-div">
                            <label for="lease-date" class="required"> Lease Date </label>
                            <input 
                                id="lease-date"
                                name="lease-date"
                                type="date"
                                value="{{ lease_date or user.lease_date }}"
                                required
                            >
                        </div>
                    </div>
        
                    <div class="input-div">
                        <label for="parking-status" class="required"> Parking Status </label>
                        <select name="parking-status" id="parking-status" required>
                            <option value="">Select Parking Status</option>

                            {% for option in status_options %}
                            {% if user.parking_status == option %}
                            <option value="{{ option }}" selected>{{ option }}</option>

                            {% else %}
                            <option value="{{ option }}">{{ option }}</option>
                            {% endif %}
                            {% endfor %}
                        </select>
                    </div>
                </div>
                {% endif %}
        
                <div class="button-div">
                    <button type="submit" class="btn submit">Update {{ user_role }} user</button>
                    <a href="{{ url_for('user.manage_users') }}" class="btn cancel">cancel</a>
                </div>
            </form>
        </div>
    </section>
    {% endblock %}
